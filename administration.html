<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - Cardinal Malula</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5fa;
  color:#172033;
}
header{
  background:#102a43;
  color:white;
  text-align:center;
  padding:25px 12px;
}
header h1{margin:0 0 8px;font-size:23px}
main{max-width:750px;width:92%;margin:25px auto}
.carte{
  background:white;
  padding:22px;
  margin-bottom:20px;
  border-radius:13px;
  box-shadow:0 4px 15px #0000000d;
}
h2{color:#102a43;margin-top:0}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  border:1px solid #ccd5e0;
  border-radius:7px;
  font-size:15px;
}
textarea{min-height:120px;resize:vertical}
label{font-weight:bold;font-size:14px}
button{
  background:#2563eb;
  color:white;
  padding:12px 17px;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
}
button:hover{background:#1d4ed8}
.secondaire{background:#526579}
#message{line-height:1.5;overflow-wrap:anywhere}
.cache{display:none}
footer{text-align:center;padding:20px;color:#526579;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>Complexe scolaire Cardinal Malula</h1>
  <p>Espace d'administration</p>
</header>

<main>

<section class="carte" id="connexion">
  <h2>Connexion administrateur</h2>
  <p>Connecte-toi avec ton compte administrateur.</p>

  <form id="formConnexion">
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="username"
           required placeholder="Ton adresse e-mail">

    <label for="motdepasse">Mot de passe</label>
    <input id="motdepasse" type="password"
           autocomplete="current-password" required
           placeholder="Ton mot de passe">

    <button type="submit">Se connecter</button>
  </form>

  <p id="message"></p>
</section>

<section class="carte cache" id="publication">
  <h2>Publier une actualité</h2>
  <p id="bienvenue"></p>

  <form id="formAnnonce">

    <label for="titre">Titre de l'annonce</label>
    <input id="titre" required maxlength="180"
           placeholder="Ex. : Sortie du Club de Science">

    <label for="categorie">Catégorie</label>
    <select id="categorie" required>
      <option value="">Choisir une catégorie</option>
      <option value="Actualité scolaire">Actualité scolaire</option>
      <option value="Club de Science">Club de Science</option>
      <option value="BDE">BDE</option>
      <option value="Événement">Événement</option>
      <option value="Annonce importante">Annonce importante</option>
    </select>

    <label for="description">Description</label>
    <textarea id="description" required
      placeholder="Écris les informations de l'annonce..."></textarea>

    <label for="dateEvenement">Date de l'événement</label>
    <input id="dateEvenement" type="date">

    <label for="heure">Heure</label>
    <input id="heure" type="text"
           placeholder="Ex. : 7h10 - 7h30">

    <label for="lieu">Lieu</label>
    <input id="lieu" type="text"
           placeholder="Lieu de l'événement">

    <label for="organisateur">Organisateur</label>
    <input id="organisateur" type="text"
           placeholder="Ex. : Club de Science">

    <button type="submit">Publier l'annonce</button>
  </form>

  <p id="messagePublication" aria-live="polite"></p>

  <hr style="border:0;border-top:1px solid #ddd;margin:25px 0">

  <h2>Mes annonces publiées</h2>
  <div id="listeAnnonces">Chargement des annonces...</div>

  <button type="button" class="secondaire"
          id="deconnexion">Se déconnecter</button>
</section>

</main>

<footer>Le meilleur est ma destinée.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tqukwjzoimhwovelzkxe.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_cFolYLhll8ZhhhpHk0Pq6Q_jFsJU41m";

const message = document.getElementById("message");
const publication = document.getElementById("publication");
const connexion = document.getElementById("connexion");

let supabaseClient;

function afficherMessage(texte) {
  message.textContent = texte;
}

function afficherErreur(element, texte) {
  element.textContent = texte;
}

function echapper(texte) {
  return String(texte ?? "").replace(/[&<>"']/g, caractere => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[caractere]);
}

async function verifierAdministrateur(session) {
  if (!session) {
    publication.classList.add("cache");
    connexion.classList.remove("cache");
    return false;
  }

  const { data, error } = await supabaseClient
    .from("admins")
    .select("user_id")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if (error || !data) {
    await supabaseClient.auth.signOut();
    publication.classList.add("cache");
    connexion.classList.remove("cache");
    afficherMessage(
      "Ce compte n'est pas autorisé à administrer le site. Vérifie son inscription dans la table admins."
    );
    return false;
  }

  connexion.classList.add("cache");
  publication.classList.remove("cache");
  document.getElementById("bienvenue").textContent =
    "Connecté : " + session.user.email;

  await chargerAnnonces();
  return true;
}

async function chargerAnnonces() {
  const liste = document.getElementById("listeAnnonces");
  liste.textContent = "Chargement...";

  const { data, error } = await supabaseClient
    .from("annonces")
    .select("id,titre,categorie,publie,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    liste.textContent = "Impossible de charger les annonces : " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    liste.textContent = "Aucune annonce enregistrée pour le moment.";
    return;
  }

  liste.replaceChildren();

  data.forEach(annonce => {
    const carte = document.createElement("div");
    carte.style.cssText =
      "padding:13px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere";

    const titre = document.createElement("strong");
    titre.textContent = annonce.titre;

    const details = document.createElement("p");
    details.textContent = annonce.categorie + " — " +
      (annonce.publie ? "Publiée" : "Brouillon");

    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = annonce.publie ? "secondaire" : "";
    bouton.textContent = annonce.publie ? "Retirer du site" : "Publier sur le site";

    bouton.addEventListener("click", async () => {
      bouton.disabled = true;

      const { error } = await supabaseClient
        .from("annonces")
        .update({ publie: !annonce.publie })
        .eq("id", annonce.id);

      bouton.disabled = false;

      if (error) {
        alert("Erreur : " + error.message);
      } else {
        await chargerAnnonces();
      }
    });

    carte.append(titre, details, bouton);
    liste.appendChild(carte);
  });
}

async function demarrer() {
  if (
    SUPABASE_URL.includes("COLLE_ICI") ||
    SUPABASE_KEY.includes("COLLE_ICI")
  ) {
    afficherMessage("Configure d'abord la Project URL et la Publishable key.");
    return;
  }

  try {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } = await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session) {
      await verifierAdministrateur(data.session);
    }
  } catch (erreur) {
    afficherMessage("Erreur de connexion : " + erreur.message);
  }
}

document.getElementById("formConnexion").addEventListener("submit",
  async evenement => {
    evenement.preventDefault();
    afficherMessage("Connexion en cours...");

    if (!supabaseClient) {
      afficherMessage("Vérifie la configuration de Supabase.");
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("motdepasse").value
    });

    if (error) {
      afficherMessage("Connexion impossible. Vérifie l'adresse e-mail et le mot de passe.");
      return;
    }

    await verifierAdministrateur(data.session);
  }
);

document.getElementById("formAnnonce").addEventListener("submit",
  async evenement => {
    evenement.preventDefault();

    const resultat = document.getElementById("messagePublication");
    resultat.textContent = "Publication en cours...";

    const { data: sessionData } =
      await supabaseClient.auth.getSession();

    const session = sessionData.session;

    if (!session || !(await verifierAdministrateur(session))) {
      resultat.textContent = "Reconnecte-toi avec un compte administrateur.";
      return;
    }

    const annonce = {
      titre: document.getElementById("titre").value.trim(),
      categorie: document.getElementById("categorie").value,
      description: document.getElementById("description").value.trim(),
      date_evenement: document.getElementById("dateEvenement").value || null,
      heure: document.getElementById("heure").value.trim() || null,
      lieu: document.getElementById("lieu").value.trim() || null,
      organisateur: document.getElementById("organisateur").value.trim() || null,
      publie: true
    };

    const { error } = await supabaseClient
      .from("annonces")
      .insert(annonce);

    if (error) {
      resultat.textContent =
        "Publication impossible : " + error.message;
      return;
    }

    resultat.textContent =
      "Annonce enregistrée et publiée dans Supabase !";

    document.getElementById("formAnnonce").reset();
    await chargerAnnonces();
  }
);

document.getElementById("deconnexion").addEventListener("click",
  async () => {
    await supabaseClient.auth.signOut();
    publication.classList.add("cache");
    connexion.classList.remove("cache");
    afficherMessage("Tu es déconnecté.");
  }
);

demarrer();
</script>

</body>
</html>
